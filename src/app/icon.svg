<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="#6D2C12"/>

  <!-- Diamond finial -->
  <path d="M16 4 L18.5 8 L16 12 L13.5 8 Z"
    fill="none" stroke="#F5EFE6" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Staff: finial down to base -->
  <line x1="16" y1="12" x2="16" y2="26"
    stroke="#F5EFE6" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Beam -->
  <line x1="6" y1="15" x2="26" y2="15"
    stroke="#F5EFE6" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Pivot ring -->
  <circle cx="16" cy="15" r="2"
    stroke="#F5EFE6" stroke-width="1" fill="#6D2C12"/>

  <!-- Left pan -->
  <path d="M 4 18 C 4 23 8 24 8 18"
    fill="none" stroke="#F5EFE6" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Right pan -->
  <path d="M 24 18 C 24 23 28 24 28 18"
    fill="none" stroke="#F5EFE6" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="13" y1="26" x2="19" y2="26"
    stroke="#F5EFE6" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="11" y1="28.5" x2="21" y2="28.5"
    stroke="#F5EFE6" stroke-width="1.5" stroke-linecap="round"/>
</svg>
